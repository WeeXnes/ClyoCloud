version: 43
jobs:
- name: Build & Test
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: NPM Install
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Installing dependencies..."
        npm install
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Build Server
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Building project..."
        npm run build
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Start PM2
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Starting application with PM2..."
        pm2 start ecosystem.config.js
        echo "Waiting for server to initialize..."
        sleep 10
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Run Tests
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Running security tests..."
        npm run test:security
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Stop PM2
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Stopping and cleaning up PM2..."
        pm2 stop all
        pm2 delete all
    useTTY: true
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: get version
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Extracting version from package.json..."
        grep -oP '"version":\s*"\K[^"]+' package.json > version.txt
        version=$(cat version.txt)
        echo "Version extracted: $version"
        echo "Extracting version description from CHANGELOG.md..."
        awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" { started = 1; print; next } started { if ($0 ~ "^(---|## )") exit; print }' CHANGELOG.md > changelog_tag_msg.txt
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Update Cutting Edge AUR Package
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        repo_url="ssh://aur@@aur.archlinux.org/clyocloud-git.git"
        repo_dir="clyocloud-git"

        git clone "$repo_url"

        ver=$(<version.txt)

        commit_hash=@commit_hash@

        sed -i "s/^_commit=.*/_commit=${commit_hash}/" "$repo_dir/PKGBUILD"

        literal_substr='\${_commit:0:7}'

        new_pkgver="${ver}.r${literal_substr}"

        sed -i "s/^pkgver=.*/pkgver=${new_pkgver}/" "$repo_dir/PKGBUILD"

        (
          cd "$repo_dir" || exit 1
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "Automatically updated version to @commit_hash@"
          git push
        )
    useTTY: true
    condition: SUCCESSFUL
    optional: true
  - type: CommandStep
    name: check if tag exists
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        version=$(cat version.txt)
        echo "Checking if tag '$version' exists on origin..."

        if git ls-remote --tags origin | grep -q "refs/tags/${version}$"; then
            echo "Tag '$version' already exists."

            new_version="${version}-@commit_hash@"
            echo "$new_version" > version.txt
            echo "Updated version.txt to '$new_version' to avoid tag conflict."

            exit 1
        else
            echo "Tag '$version' does not exist. Proceeding with original version."
            exit 0
        fi
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  - type: CreateTagStep
    name: create tag
    tagName: '@file:version.txt@'
    tagMessage: '@file:changelog_tag_msg.txt@'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400

- name: Release Stable AUR
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@tag@'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: Update Stable AUR Package
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        repo_url="ssh://aur@@aur.archlinux.org/clyocloud.git"
        repo_dir="clyocloud"

        git clone "$repo_url"

        version=@tag@

        sed -i "s/^pkgver=.*/pkgver=${version}/" "$repo_dir/PKGBUILD"

        (
          cd "$repo_dir" || exit 1
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "Automatically updated version to ${version}"
          git push
        )
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: TagCreateTrigger
    branches: master
    projects: ClyoCloud
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
