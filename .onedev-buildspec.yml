version: 43
jobs:
- name: Build & Test
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Build Test
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        npm install
        npx nuxt build
        npx vitest run tests/security.spec.ts
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
