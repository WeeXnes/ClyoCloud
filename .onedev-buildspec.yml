version: 43
jobs:
- name: Build & Test
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: NPM Install
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Installing dependencies..."
        npm install
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Build Server
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Building project..."
        npm run build
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Start PM2
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Starting application with PM2..."
        pm2 start ecosystem.config.js
        echo "Waiting for server to initialize..."
        sleep 10
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Run Tests
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Running security tests..."
        npm run test:security
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Stop PM2
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Stopping and cleaning up PM2..."
        pm2 stop all
        pm2 delete all
    useTTY: true
    condition: ALWAYS
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
