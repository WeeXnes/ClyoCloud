version: 40
jobs:
- name: Deploy Website
  jobExecutor: website
  steps:
  - !CommandStep
    name: Rebuild Website
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        cd /home/weexnes/website
        git pull
        npm i
        npm run build
        pm2ctrl restart
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Rebuild Onedev Api Wrapper
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        cd /home/weexnes/onedev-api-wrapper
        git pull
        npm i
        npm run build
        pm2ctrl restart
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger {}
  - !PullRequestUpdateTrigger {}
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
